name: PR Conventional Commit Validation

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

jobs:
  validate-pr-title:
    runs-on: ubuntu-latest
    steps:
      - name: PR Conventional Commit Validation
        uses: ytanikin/PRConventionalCommits@1.3.0
        with:
          task_types: '["feat","fix","refactor","docs","perf","style","test","chore","ci","revert","build","wip","deps","security","infra"]'
          # Dependabot's GITHUB_TOKEN is always read-only on pull_request events, so adding the
          # label failed every Dependabot PR with "Resource not accessible by integration".
          # The title is still validated; only the labelling is skipped for Dependabot.
          add_label: ${{ github.event.pull_request.user.login != 'dependabot[bot]' }}
          custom_labels: '{"feat": "feature", "fix": "fix", "docs": "documentation", "test": "test", "ci": "CI/CD", "refactor": "refactor", "perf": "performance", "chore": "chore", "revert": "revert", "build": "build", "wip": "WIP", "deps": "dependencies", "security": "security", "infra": "infrastructure"}'
