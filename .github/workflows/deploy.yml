name: Deploy on Version Tag

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  BUILD_DATE: 'set by build_release_info step'
  COMMIT_DATE: 'set by build_release_info step'
  COMMIT_HASH: 'set by build_release_info step'
  VERSION_TAG: 'set by build_release_info step'
  DOCKER_TAG: 'set by extract-tag step'

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  generate-changelog:
    name: Generate changelog
    runs-on: ubuntu-latest
    outputs:
      release_body: ${{ steps.git-cliff.outputs.content }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Generate a changelog
        uses: orhun/git-cliff-action@v4
        id: git-cliff
        with:
          config: cliff.toml
          args: --latest --github-repo ${{ github.repository }}
          github_token: ${{ secrets.GITHUB_TOKEN }}

  build-stage:
    name: Build Stage Docker Image
    needs: generate-changelog
    runs-on: ubuntu-latest
    # Only run for pre-release tags (e.g., v1.0.0-rc)
    if: ${{ contains(github.ref_name, '-rc') }}
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    outputs:
      docker-tag: ${{ steps.extract-tag.outputs.tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set build and release information
        id: build_release_info
        run: |
          BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          COMMIT_DATE=$(git log -1 --format='%cI')
          COMMIT_HASH=$(git rev-parse HEAD)
          BUILD_BRANCH=$GITHUB_REF_NAME
          VERSION_TAG=${GITHUB_REF#refs/tags/}
          echo "BUILD_DATE=$BUILD_DATE" >> $GITHUB_ENV
          echo "COMMIT_DATE=$COMMIT_DATE" >> $GITHUB_ENV
          echo "COMMIT_HASH=$COMMIT_HASH" >> $GITHUB_ENV
          echo "BUILD_BRANCH=$BUILD_BRANCH" >> $GITHUB_ENV
          echo "VERSION_TAG=$VERSION_TAG" >> $GITHUB_ENV

      - name: Log in to the Container registry
        uses: docker/login-action@v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=${{ env.VERSION_TAG }}

      - name: Extract Docker Tag from JSON
        id: extract-tag
        run: |
          FULL_TAG=$(echo '${{ steps.meta.outputs.json }}' | jq -r '.tags[0]')
          if [ -z "$FULL_TAG" ] || [ "$FULL_TAG" = "null" ]; then
            echo "Error: Failed to extract Docker tag (tags[0] missing or null)"
            exit 1
          fi
          if [[ "$FULL_TAG" != *:* ]]; then
            echo "Error: Extracted tag does not contain a colon: $FULL_TAG"
            exit 1
          fi
          DOCKER_TAG=$(echo "$FULL_TAG" | cut -d':' -f2)
          if [ -z "$DOCKER_TAG" ]; then
            echo "Error: Docker tag part after colon is empty in: $FULL_TAG"
            exit 1
          fi
          echo "Extracted Docker tag: $DOCKER_TAG"
          echo "tag=$DOCKER_TAG" >> $GITHUB_OUTPUT

      - name: Build and push Docker image for Stage
        id: push
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILD_DATE=${{ env.BUILD_DATE }}
            COMMIT_DATE=${{ env.COMMIT_DATE }}
            COMMIT_HASH=${{ env.COMMIT_HASH }}
            BUILD_BRANCH=${{ env.BUILD_BRANCH }}
            VERSION=${{ env.VERSION_TAG }}

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  build-production:
    name: Build Production Docker Image
    needs: generate-changelog
    runs-on: ubuntu-latest
    if: ${{ !contains(github.ref_name, '-rc') }}
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    outputs:
      docker-tag: ${{ steps.extract-tag.outputs.tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set build and release information
        id: build_release_info
        run: |
          BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          COMMIT_DATE=$(git log -1 --format='%cI')
          COMMIT_HASH=$(git rev-parse HEAD)
          BUILD_BRANCH=$GITHUB_REF_NAME
          VERSION_TAG=${GITHUB_REF#refs/tags/}
          echo "BUILD_DATE=$BUILD_DATE" >> $GITHUB_ENV
          echo "COMMIT_DATE=$COMMIT_DATE" >> $GITHUB_ENV
          echo "COMMIT_HASH=$COMMIT_HASH" >> $GITHUB_ENV
          echo "BUILD_BRANCH=$BUILD_BRANCH" >> $GITHUB_ENV
          echo "VERSION_TAG=$VERSION_TAG" >> $GITHUB_ENV

      - name: Log in to the Container registry
        uses: docker/login-action@v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=${{ env.VERSION_TAG }}
            type=raw,value=latest

      - name: Extract Docker Tag from JSON
        id: extract-tag
        run: |
          FULL_TAG=$(echo '${{ steps.meta.outputs.json }}' | jq -r '.tags[0]')
          if [ -z "$FULL_TAG" ] || [ "$FULL_TAG" = "null" ]; then
            echo "Error: Failed to extract Docker tag (tags[0] missing or null)"
            exit 1
          fi
          if [[ "$FULL_TAG" != *:* ]]; then
            echo "Error: Extracted tag does not contain a colon: $FULL_TAG"
            exit 1
          fi
          DOCKER_TAG=$(echo "$FULL_TAG" | cut -d':' -f2)
          if [ -z "$DOCKER_TAG" ]; then
            echo "Error: Docker tag part after colon is empty in: $FULL_TAG"
            exit 1
          fi
          echo "Extracted Docker tag: $DOCKER_TAG"
          echo "tag=$DOCKER_TAG" >> $GITHUB_OUTPUT

      - name: Build and push Docker image for Production
        id: push
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILD_DATE=${{ env.BUILD_DATE }}
            COMMIT_DATE=${{ env.COMMIT_DATE }}
            COMMIT_HASH=${{ env.COMMIT_HASH }}
            BUILD_BRANCH=${{ env.BUILD_BRANCH }}
            VERSION=${{ env.VERSION_TAG }}

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  publish-release:
    name: Publish GitHub Release
    needs: [generate-changelog]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Set version tag
        run: |
          VERSION_TAG=${GITHUB_REF#refs/tags/}
          echo "VERSION_TAG=$VERSION_TAG" >> $GITHUB_ENV

      - name: Publish GitHub Pre-release
        if: ${{ contains(github.ref_name, '-rc') }}
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.VERSION_TAG }}
          name: 'Pre-release ${{ env.VERSION_TAG }}'
          body: ${{ needs.generate-changelog.outputs.release_body }}
          prerelease: true
          draft: false

      - name: Publish GitHub Release
        if: ${{ !contains(github.ref_name, '-rc') }}
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.VERSION_TAG }}
          name: 'Release ${{ env.VERSION_TAG }}'
          body: ${{ needs.generate-changelog.outputs.release_body }}
          prerelease: false
          draft: false

  # The Azure variant of the image: the published application image with the database baked back
  # in. App Service has no volume to seed a database into and no per-deployment place to point
  # AHB_DB_PATH at, so the slim image cannot run there (Hochfrequenz/ahb-tabellen#985). This adds
  # one layer to the very image the Compose stacks run, rather than building a second application
  # image that could drift from it.
  #
  # TRANSITIONAL, like the two deploy jobs below and infra/ itself: it goes when Azure does.
  #
  # One job serves both tiers. Whichever build job ran for this tag supplies the application tag;
  # the other was skipped and contributes an empty string, so `||` picks the one that exists.
  build-azure-image:
    name: Build Azure Docker Image
    needs: [build-stage, build-production]
    if: ${{ !cancelled() && (needs.build-stage.result == 'success' || needs.build-production.result == 'success') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      docker-tag: ${{ steps.refs.outputs.tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Log in to the Container registry
        uses: docker/login-action@v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image references
        id: refs
        env:
          APP_TAG: ${{ needs.build-stage.outputs.docker-tag || needs.build-production.outputs.docker-tag }}
          REPOSITORY: ${{ github.repository }}
        run: |
          if [ -z "$APP_TAG" ]; then
            echo "::error::Neither build job produced an application tag"
            exit 1
          fi
          # Docker references must be lowercase and the repository name is not. The build jobs get
          # that for free from docker/metadata-action; a reference assembled by hand does not.
          IMAGE="${REGISTRY}/${REPOSITORY,,}"
          # `-azure` marks the tag as the gigabyte-sized variant, so it cannot be mistaken for the
          # image the Compose stacks pull, while keeping the release it came from readable:
          # 2.0.0-rc01 -> 2.0.0-rc01-azure.
          # Read back from the Dockerfile rather than repeated here, so the pinned digest has
          # exactly one home and the preflight check below cannot test a different image than
          # the build pulls.
          DB_IMAGE=$(sed -n 's/^ARG DB_IMAGE=//p' infra/azure-image/Dockerfile)
          if [ -z "$DB_IMAGE" ]; then
            echo "::error::No 'ARG DB_IMAGE=' default found in infra/azure-image/Dockerfile"
            exit 1
          fi
          echo "tag=${APP_TAG}-azure" >> "$GITHUB_OUTPUT"
          echo "app-image=${IMAGE}:${APP_TAG}" >> "$GITHUB_OUTPUT"
          echo "azure-image=${IMAGE}:${APP_TAG}-azure" >> "$GITHUB_OUTPUT"
          echo "db-image=${DB_IMAGE}" >> "$GITHUB_OUTPUT"
          echo "Application image: ${IMAGE}:${APP_TAG}"
          echo "Azure image:       ${IMAGE}:${APP_TAG}-azure"
          echo "Database image:    ${DB_IMAGE}"

      # The database image belongs to another repository and is private (it holds licensed data
      # unencrypted — hf-apps-collection ADR-0015). GITHUB_TOKEN reaches packages owned by THIS
      # repository by default, so without an explicit grant the build fails on an opaque
      # `denied`/`unauthorized` from the registry. Check it up front and say what to do instead.
      - name: Check the database image is reachable
        env:
          DB_IMAGE: ${{ steps.refs.outputs.db-image }}
        run: |
          if ! docker manifest inspect "$DB_IMAGE" > /dev/null 2>&1; then
            echo "::error::Cannot pull $DB_IMAGE. It is a private package owned by Hochfrequenz/xml-migs-and-ahbs, so this repository needs read access to it: GHCR package -> Package settings -> Manage Actions access -> add Hochfrequenz/ahb-tabellen with the Read role."
            exit 1
          fi
          echo "Database image is reachable: $DB_IMAGE"

      # The context is infra/azure-image, which holds nothing but the Dockerfile: both inputs are
      # images, so there is no source to send. DB_IMAGE is passed so the preflight check above and
      # the build cannot disagree, with the Dockerfile's pinned digest as the single default.
      - name: Build and push the Azure image
        uses: docker/build-push-action@v7.4.0
        with:
          context: infra/azure-image
          push: true
          tags: ${{ steps.refs.outputs.azure-image }}
          build-args: |
            APP_IMAGE=${{ steps.refs.outputs.app-image }}
            DB_IMAGE=${{ steps.refs.outputs.db-image }}

  # Re-enabled for the Azure endgame. These deploy the `-azure` image built above — the only
  # variant App Service can run — because hochfrequenz.de still resolves to the App Services
  # while the Compose stacks in Hochfrequenz/hf-apps-collection run on hochfrequenz.app.
  #
  # Retiring Azure for good, by deleting these jobs, infra/ and the Pulumi stacks, remains its own
  # change, to be made once DNS has moved and the Compose stacks have served production traffic.
  deploy-stage:
    name: Deploy to Stage
    needs: [build-azure-image]
    if: ${{ contains(github.ref_name, '-rc') }}
    permissions:
      contents: read
      id-token: write
    uses: Hochfrequenz/reusable-workflows/.github/workflows/deploy.yaml@34fe37930a5982285b67a7a9dc180805baee4e0f
    with:
      pulumi_stack_name: stage
      docker_tag: ${{ needs.build-azure-image.outputs.docker-tag }}
      working_directory: infra
    secrets:
      azure_client_id: ${{ secrets.AZURE_CLIENT_ID_GITHUB_ACTION_OIDC }}
      azure_tenant_id: ${{ secrets.AZURE_TENANT_ID }}
      azure_subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID_HF_APPS }}
      pulumi_access_token: ${{ secrets.PULUMI_ACCESS_TOKEN }}

  deploy-production:
    name: Deploy to Production
    needs: [build-azure-image]
    if: ${{ !contains(github.ref_name, '-rc') }}
    permissions:
      contents: read
      id-token: write
    uses: Hochfrequenz/reusable-workflows/.github/workflows/deploy.yaml@34fe37930a5982285b67a7a9dc180805baee4e0f
    with:
      pulumi_stack_name: prod
      docker_tag: ${{ needs.build-azure-image.outputs.docker-tag }}
      working_directory: infra
    secrets:
      azure_client_id: ${{ secrets.AZURE_CLIENT_ID_GITHUB_ACTION_OIDC }}
      azure_tenant_id: ${{ secrets.AZURE_TENANT_ID }}
      azure_subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID_HF_APPS }}
      pulumi_access_token: ${{ secrets.PULUMI_ACCESS_TOKEN }}
