name: Deploy on Version Tag

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  PROJECT_NAME: ahb-tabellen
  OCTOPUS_SPACE: Default
  BUILD_DATE: 'set by build_release_info step'
  COMMIT_ID: 'set by build_release_info step'
  VERSION_TAG: 'set by build_release_info step'

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  generate-changelog:
    name: Generate changelog
    runs-on: ubuntu-latest
    outputs:
      release_body: ${{ steps.git-cliff.outputs.content }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Generate a changelog
        uses: orhun/git-cliff-action@v4
        id: git-cliff
        with:
          config: cliff.toml
          args: --latest --github-repo ${{ github.repository }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
  deploy:
    name: Deploy to Docker and Octopus Deploy
    needs: generate-changelog
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      attestations: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set build and release information
        id: build_release_info
        run: |
          BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          COMMIT_ID=$(git rev-parse HEAD)
          VERSION_TAG=${GITHUB_REF#refs/tags/}
          echo "BUILD_DATE=$BUILD_DATE" >> $GITHUB_ENV
          echo "COMMIT_ID=$COMMIT_ID" >> $GITHUB_ENV
          echo "VERSION_TAG=$VERSION_TAG" >> $GITHUB_ENV

      - name: Log in to the Container registry
        uses: docker/login-action@v3.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5.10.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@v6.18.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILD_DATE=${{ env.BUILD_DATE }}
            COMMIT_ID=${{ env.COMMIT_ID }}
            VERSION=${{ env.VERSION_TAG }}

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v3
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Publish GitHub Pre-release
        if: ${{ contains(env.VERSION_TAG, '-') }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION_TAG }}
          name: 'Pre-release ${{ env.VERSION_TAG }}'
          body: ${{ needs.generate-changelog.outputs.release_body }}
          prerelease: true
          draft: false

      - name: Publish GitHub Release
        if: ${{ !contains(env.VERSION_TAG, '-') }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION_TAG }}
          name: 'Release ${{ env.VERSION_TAG }}'
          body: ${{ needs.generate-changelog.outputs.release_body }}
          prerelease: false
          draft: false

      - name: Login to Octopus Deploy 🐙
        uses: OctopusDeploy/login@v1
        with:
          server: https://hochfrequenz.octopus.app
          service_account_id: 990f3f62-2e3f-4b1e-9569-d5a6817a2c80

      - name: Create a release in Octopus Deploy 🐙
        uses: OctopusDeploy/create-release-action@v3
        with:
          space: ${{ env.OCTOPUS_SPACE }}
          project: ${{ env.PROJECT_NAME }}
          release_number: ${{ env.VERSION_TAG }}
          git_ref: ${{ github.ref }}
          git_commit: ${{ github.sha }}
          release_notes: 'Release created from GitHub Actions. Version: ${{ env.VERSION_TAG }}'

      - name: Deploy a release in Octopus Deploy 🐙
        uses: OctopusDeploy/deploy-release-action@v3
        with:
          space: ${{ env.OCTOPUS_SPACE }}
          project: ${{ env.PROJECT_NAME }}
          release_number: ${{ env.VERSION_TAG }}
          environments: |
            Staging
