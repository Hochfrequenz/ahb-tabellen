name: 'Pull Request'
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install modules
        run: npm ci

      - name: Prettier
        run: npm run format:check

      - name: Lint frontend
        run: npm run ng:lint

      - name: Lint server
        run: npm run server:lint

      # No database is needed: these are jsdom unit tests, and nothing under src/ reads the
      # archive password. It used to be passed here and was never used.
      - name: Unit tests
        run: npm test

      - name: Build frontend
        run: npm run ng:build

      - name: Build server
        run: npm run server:build

  docker:
    name: Build the container image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      # Build only — nothing is pushed. The image is built from a tag by deploy.yml; this catches
      # a broken Dockerfile on the pull request instead of during a release.
      - name: Build image
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          push: false
          build-args: |
            VERSION=ci
            COMMIT_HASH=${{ github.sha }}
