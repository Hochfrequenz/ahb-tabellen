name: Publish AHB database image

# The AHB database is not in this repository and not in the application image. It is generated
# from paid-for XML in the private Hochfrequenz/xml-migs-and-ahbs repository, and published here
# as its own versioned image which the hf-apps-collection stacks seed into a volume.
#
# Run this after cutting a release in xml-migs-and-ahbs. It prints the tag and digest to put in
# stacks/ahb-tabellen-stage/compose.yaml; verify on stage, then promote the same pair to prod.

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag in Hochfrequenz/xml-migs-and-ahbs to take the database from'
        required: true
        type: string
      db_version:
        description: "Version for the published image, e.g. 'v2026.08.06.0'"
        required: true
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}-db

# Serialises two dispatches of the same version so they cannot race to push one tag concurrently.
# Note this orders them rather than preventing the second: re-running a version still overwrites
# the tag with a new digest. Compose pins `tag@digest`, so an already-deployed stack keeps
# resolving the digest it named — but check before reusing a version.
concurrency:
  group: publish-db-image-${{ inputs.db_version }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build and push the database image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      # Inputs are passed through `env` rather than interpolated into the scripts below, so a
      # value containing shell metacharacters cannot execute anything.
      - name: Validate inputs
        env:
          DB_VERSION: ${{ inputs.db_version }}
        run: |
          # Matched against the whole value. db_version is interpolated into the `tags:` and
          # `build-args:` block scalars below, where a newline would inject an extra tag or an
          # extra build-arg — so a line-oriented check like `grep` is not enough here: it
          # succeeds as soon as ONE line matches. Bash's `=~` has no multiline mode, so `$`
          # anchors at the end of the string and any embedded CR or LF fails the match.
          if [[ ! "$DB_VERSION" =~ ^v[0-9A-Za-z._-]+$ ]]; then
            echo "db_version must look like 'v2026.08.06.0' (got '$DB_VERSION')" >&2
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install p7zip
        run: sudo apt-get update && sudo apt-get install -y p7zip-full

      # The decrypted database is ~1.1 GB and the image layer roughly the same again, so fail here
      # with a clear message rather than halfway through a docker build.
      - name: Check available disk space
        run: |
          df -h /
          available_kb="$(df -Pk / | awk 'NR==2 {print $4}')"
          required_kb=$((6 * 1024 * 1024))   # 6 GiB: archive + decrypted db + image layer + slack
          if [ "$available_kb" -lt "$required_kb" ]; then
            echo "Only $((available_kb / 1024)) MiB free on /; need at least $((required_kb / 1024)) MiB" >&2
            exit 1
          fi

      - name: Download the encrypted database from the upstream release
        env:
          # Fine-grained PAT with read access to the private Hochfrequenz/xml-migs-and-ahbs repo.
          GH_TOKEN: ${{ secrets.XML_MIGS_AND_AHBS_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          mkdir -p db-build
          gh release download "$RELEASE_TAG" \
            --repo Hochfrequenz/xml-migs-and-ahbs \
            --pattern 'ahb_*.db.encrypted.7z' \
            --dir db-build
          ls -la db-build

      - name: Decrypt the database
        env:
          # Organization-wide secret; also in the Hochfrequenz 1Password vault.
          DB_7Z_ARCHIVE_PASSWORD: ${{ secrets.SQLITE_AHB_DB_7Z_ARCHIVE_PASSWORD }}
        run: |
          if [ -z "$DB_7Z_ARCHIVE_PASSWORD" ]; then
            echo "SQLITE_AHB_DB_7Z_ARCHIVE_PASSWORD is not set" >&2
            exit 1
          fi
          archive="$(find db-build -name 'ahb_*.db.encrypted.7z' | head -n 1)"
          if [ -z "$archive" ]; then
            echo "No ahb_*.db.encrypted.7z asset found on that release" >&2
            exit 1
          fi
          # The password reaches 7z as an argument, so it is visible in /proc/<pid>/cmdline to
          # anything else on the runner for the duration. Acceptable here — an ephemeral,
          # single-tenant GitHub runner — but it is not hidden, only unlogged. 7z has no option to
          # read a password from stdin or a file.
          7z x -y -p"$DB_7Z_ARCHIVE_PASSWORD" -odb-build "$archive"
          rm -f "$archive"
          test -f db-build/ahb.db || { echo "Archive did not contain ahb.db" >&2; exit 1; }
          ls -la db-build

      # The Dockerfile lives in db-image/, the database in db-build/. Put the seed script beside
      # the database so the build context holds everything the Dockerfile COPYs.
      - name: Assemble the build context
        run: cp db-image/seed-ahb-db.sh db-build/

      - name: Log in to the Container registry
        uses: docker/login-action@v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ inputs.db_version }}

      - name: Build and push the database image
        id: push
        uses: docker/build-push-action@v7.3.0
        with:
          context: db-build
          file: db-image/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            DB_VERSION=${{ inputs.db_version }}

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Summarise what to do next
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          DB_VERSION: ${{ inputs.db_version }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          {
            echo "## Database image published"
            echo
            echo "In \`stacks/ahb-tabellen-stage/compose.yaml\` (Hochfrequenz/hf-apps-collection),"
            echo "change **both** of these — they always travel together:"
            echo
            echo '```yaml'
            echo "  ahb-tabellen-db:"
            echo "    image: ${IMAGE}:${DB_VERSION}@${DIGEST}"
            echo
            echo "  ahb-tabellen-stage:"
            echo "    environment:"
            echo "      AHB_DB_VERSION: ${DB_VERSION}"
            echo '```'
            echo
            echo "The image tag re-seeds the volume; \`AHB_DB_VERSION\` is what makes compose"
            echo "recreate the application container so it opens the new file. Without it the"
            echo "deploy succeeds and the app keeps serving the previous dataset."
            echo
            echo "Verify on stage, then copy both lines into \`stacks/ahb-tabellen/compose.yaml\`."
          } >> "$GITHUB_STEP_SUMMARY"
