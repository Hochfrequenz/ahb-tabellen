<div class="min-h-[60vh] flex flex-col items-center justify-center gap-6 px-4 text-center">
  <h1 class="text-2xl font-semibold text-hf-weiches-schwarz">Anmelden</h1>
  <p class="text-hf-weiches-schwarz/70 max-w-md">
    Melden Sie sich an, um auf die AHB-Tabellen zuzugreifen. Hochfrequenz-Mitarbeitende nutzen ihr
    Microsoft-Konto; alle anderen melden sich über Auth0 an.
  </p>
  <div class="flex flex-col gap-3 w-full max-w-xs">
    <button
      class="rounded-full bg-hf-weiches-schwarz text-white text-[16px] py-3 px-5"
      (click)="signIn('microsoft')">
      Mit Microsoft anmelden
    </button>
    <button
      class="rounded-full bg-hf-pastell-rose text-hf-weiches-schwarz text-[16px] py-3 px-5"
      (click)="signIn('auth0')">
      Anmelden (Auth0)
    </button>
  </div>
</div>
