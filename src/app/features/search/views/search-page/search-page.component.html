<div class="search-page">
  <mat-toolbar class="search-header">
    <h1>AHB Globale Suche</h1>
    <span class="spacer"></span>
  </mat-toolbar>

  <div class="search-content">
    <!-- Search Filters -->
    <mat-card class="filters-card">
      <mat-card-header>
        <mat-card-title>Suche & Filter</mat-card-title>
      </mat-card-header>
      <mat-card-content>
        <app-search-filters
          (queryChange)="onQueryChange($event)"
          (filtersChange)="onFiltersChange($event)">
        </app-search-filters>
      </mat-card-content>
    </mat-card>

    <!-- Search Results -->
    <mat-card class="results-card">
      <mat-card-header>
        <mat-card-title>
          Ergebnisse
          <span *ngIf="searchResults" class="result-count">
            ({{ searchResults.total }} items)
          </span>
        </mat-card-title>
      </mat-card-header>
      <mat-card-content>
        <div *ngIf="loading" class="loading-container">
          <mat-spinner diameter="40"></mat-spinner>
          <p>Searching...</p>
        </div>

        <div *ngIf="error" class="error-container">
          <mat-icon color="warn">error</mat-icon>
          <p>{{ error }}</p>
        </div>

        <app-search-table
          *ngIf="searchResults && !loading && !error"
          [data]="searchResults.items || []"
          [totalItems]="searchResults.total || 0"
          [page]="searchResults.page || 1"
          [pageSize]="searchResults.pageSize || 25"
          (pageChange)="onPageChange($event)"
          (pageSizeChange)="onPageSizeChange($event)"
          (sortChange)="onSortChange($event)">
        </app-search-table>
      </mat-card-content>
    </mat-card>
  </div>
</div>
